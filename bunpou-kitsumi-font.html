function toggleUnderstood(i){
 const pos=understood.indexOf(i);
 if(pos===-1){
   understood.push(i);
   understood.sort((a,b)=>a-b);
   playCorrect();
   speakFeedback("Pola ditandai sudah dipahami.");
 }else{
   understood.splice(pos,1);
   playWrong();
   speakFeedback("Tanda pemahaman dibatalkan.");
 }
 localStorage.setItem("kitsumiBunpouUnderstood",JSON.stringify(understood));
 renderMenu();
}

let audioCtx=null;

function getAudioContext(){
 if(!audioCtx){
   const Ctx=window.AudioContext||window.webkitAudioContext;
   if(!Ctx) return null;
   audioCtx=new Ctx();
 }
 if(audioCtx.state==="suspended") audioCtx.resume();
 return audioCtx;
}

function tone(freq, duration, type="sine", volume=0.045, delay=0){
 const ctx=getAudioContext();
 if(!ctx) return;
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();
 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(0.0001,ctx.currentTime+delay);
 gain.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+delay+0.015);
 gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+delay+duration);
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start(ctx.currentTime+delay);
 osc.stop(ctx.currentTime+delay+duration+0.03);
}

 // Dua nada pendek: terasa seperti konfirmasi berhasil.
 tone(660,0.11,"sine",0.05,0);
 tone(880,0.16,"sine",0.05,0.10);
}

function playWrong(){
 // Nada turun, singkat dan tidak mengganggu.
 tone(330,0.13,"sine",0.04,0);
 tone(220,0.18,"sine",0.035,0.12);
}

function playComplete(){
 // Jingle selesai 4 nada.
 tone(523,0.12,"sine",0.045,0);
 tone(659,0.12,"sine",0.045,0.12);
 tone(784,0.12,"sine",0.045,0.24);
 tone(1047,0.22,"sine",0.05,0.36);
}

function speakFeedback(text, lang="id-ID"){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=lang;
 u.rate=0.92;
 u.pitch=1.08;
 u.volume=0.9;
 speechSynthesis.speak(u);
}

function renderLesson(){
 const l=lessons[current];
 $("lessonTag").textContent=`Pelajaran ${current+1} / ${lessons.length}`;
 $("lessonTitle").textContent=l[0];
 $("pattern").textContent=l[1];
 $("meaning").textContent=l[2];
 $("example").textContent=l[3];
 $("translation").textContent=l[4];
 $("bar").style.width=((step)/3*100)+"%";
 $("feedback").style.display="none";
 selected=[];

 // Step 0 = explanation only. No question appears immediately.
 if(step===0){
   $("exercise").innerHTML=`
    <div class="question">📘 Pahami dulu pola ini</div>
    <div class="explain">
      <div class="example">"${l[3]}"</div>
      <div class="muted">${l[4]}</div>
      <p class="muted" style="margin-bottom:0">
        Pola <b>${l[1]}</b> digunakan untuk ${l[2].toLowerCase()}.
        Dengarkan penjelasan singkatnya, lalu lanjut ke latihan.
      </p>
    </div>
    <button class="check" onclick="speakExplanation()">🔊 Dengarkan penjelasan</button>
    <button class="check" style="margin-top:8px;background:#eef2ff;color:#3156d8" onclick="startExercises()">Saya sudah paham → Mulai latihan</button>`;
   speakExplanation(true);
   return;
 }

 // Step 1 = exercise 1: identify the active pattern.
 if(step===1){
   const choices=makePatternChoices(current);
   $("exercise").innerHTML=`
    <div class="question">Soal 1/3 — Pola mana yang sedang dipelajari?</div>
    <div class="tiles" id="tiles"></div>
    <button class="check" onclick="checkPattern()">Periksa</button>`;
   choices.forEach((x,i)=>addChoice(x,i));
 }
 // Step 2 = exercise 2: build the exact example sentence from the active lesson.
 else if(step===2){
   const practice = makePracticeSentence(l[3], l[4]);
   const words=tokenizeSentence(practice.jp);
   const shuffled=words.slice();
   shuffle(shuffled);
   $("exercise").innerHTML=`
    <div class="question">Soal 2/3 — Susun kalimat baru dengan pola yang sama.</div>
    <div class="muted" style="margin-bottom:12px">Arti: ${practice.id}</div>
    <div class="answer" id="answer"></div>
    <div class="tiles" id="tiles"></div>
    <button class="check" onclick="checkSentence()">Periksa</button>`;
   shuffled.forEach((x,i)=>addTile(x,i));
 }
 // Step 3 = exercise 3: exact meaning of the active lesson's example.
 else {
   const choices=makeMeaningChoices(current);
   $("exercise").innerHTML=`
    <div class="question">Soal 3/3 — Apa arti kalimat ini?</div>
    <div class="jp">${l[3]}</div>
    <div class="tiles" id="tiles"></div>
    <button class="check" onclick="checkMeaningFinal()">Periksa</button>`;
   choices.forEach((x,i)=>addChoice(x,i));
 }
}

function startExercises(){
 stopSpeech();
 step=1;
 renderLesson();
}

function speakExplanation(auto=false){
 if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const l=lessons[current];
   const text=`Pola ${l[1]}. ${l[2]}. Contohnya, ${l[3]}. Artinya, ${l[4]}. Ingat pola ini sebelum mulai latihan.`;
   const u=new SpeechSynthesisUtterance(text);
   u.lang="id-ID";
   u.rate=0.88;
   u.pitch=1.08;
   speechSynthesis.speak(u);
 }
}

function stopSpeech(){
 if("speechSynthesis" in window) speechSynthesis.cancel();
}

function tokenizeSentence(sentence){
 return sentence.replace(/[。！？]/g,"").split(/\s+/).filter(Boolean);
}

function makePatternChoices(index){
 const correct=lessons[index][1];
 const pool=[];
 for(let offset=1; pool.length<2 && offset<lessons.length; offset++){
   const candidate=lessons[(index+offset)%lessons.length][1];
   if(candidate!==correct && !pool.includes(candidate)) pool.push(candidate);
 }
 const result=[correct,...pool];
 shuffle(result);
 return result;
}

function makeMeaningChoices(index){
 const correct=lessons[index][4];
 const pool=[];
 for(let offset=1; pool.length<2 && offset<lessons.length; offset++){
   const candidate=lessons[(index+offset)%lessons.length][4];
   if(candidate!==correct && !pool.includes(candidate)) pool.push(candidate);
 }
 const result=[correct,...pool];
 shuffle(result);
 return result;
}


// Membuat soal baru yang tetap memakai pola pelajaran aktif,
// tetapi tidak mengulang contoh penjelasan di atas.
function makePracticeSentence(example, translation){
 const jpMap = [
   ["わたし","せんせい"],["がくせい","せんせい"],["ともだち","かぞく"],
   ["ほん","えんぴつ"],["みず","おちゃ"],["コーヒー","おちゃ"],
   ["りんご","パン"],["バナナ","りんご"],["ねこ","いぬ"],
   ["いぬ","ねこ"],["がっこう","としょかん"],["にほん","きょうと"],
   ["ここ","あそこ"],["あした","あさって"],["きょう","あした"],
   ["きのう","おととい"],["あさ","よる"],["よる","あさ"],
   ["7じ","8じ"],["9じ","10じ"],["5じ","6じ"],["1じかん","2じかん"],
   ["べんきょうします","はたらきます"],["はなします","よみます"],
   ["のみます","たべます"],["たべます","のみます"],["みます","ききます"],
   ["いきます","かえります"],["かえります","いきます"],
   ["おもしろいです","たのしいです"],["おいしいです","あまいです"],
   ["しずかです","きれいです"],["おおきいです","ちいさいです"],
   ["あつい","さむい"],["ひま","いそがしい"]
 ];
 let jp=example;
 for(const [a,b] of jpMap){
   if(jp.includes(a)){ jp=jp.replace(a,b); break; }
 }
 if(jp===example){
   // Fallback: make a safe lexical variation while keeping the grammar shape.
   if(jp.includes("ほん")) jp=jp.replace("ほん","かばん");
   else if(jp.includes("みず")) jp=jp.replace("みず","おちゃ");
   else if(jp.includes("がっこう")) jp=jp.replace("がっこう","としょかん");
   else if(jp.includes("ともだち")) jp=jp.replace("ともだち","かぞく");
   else jp=jp.replace("です","です。").replace(/。+/,"。");
 }
 let id=translation;
 const idMap=[
   ["Saya adalah siswa.","Saya adalah guru."],
   ["Saya adalah siswa.","Saya adalah guru."],
   ["Minum air.","Minum teh."],
   ["Belajar di sekolah.","Belajar di perpustakaan."],
   ["Berbicara dengan teman.","Berbicara dengan keluarga."],
   ["Ini buku saya.","Ini pensil saya."],
   ["Ada kucing.","Ada anjing."],
   ["Ada buku di atas meja.","Ada pensil di atas meja."],
   ["Kemarin belajar.","Kemarin bekerja."],
   ["Sekarang sedang belajar.","Sekarang sedang bekerja."],
   ["Ingin pergi ke Jepang.","Ingin pergi ke Kyoto."],
   ["Makan apel.","Makan roti."],
   ["Karena panas, minum air.","Karena panas, minum teh."],
   ["Semoga besok cerah.","Semoga lusa cerah."]
 ];
 for(const [a,b] of idMap){
   if(id===a){id=b;break;}
 }
 return {jp, id};
}

function addChoice(text,i){
 const b=document.createElement("button");
 b.className="tile";
 b.textContent=text;
 b.dataset.i=i;
 b.onclick=()=>{
   document.querySelectorAll("#tiles .tile").forEach(x=>{
     x.classList.remove("used");
     x.style.border="";
   });
   b.classList.add("used");
   b.style.border="2px solid #3156d8";
   selected=[text];
 };
 $("tiles").appendChild(b);
}

function addTile(text,i){
 const b=document.createElement("button");
 b.className="tile";
 b.textContent=text;
 b.dataset.i=i;
 b.onclick=()=>{
   if(b.classList.contains("used"))return;
   b.classList.add("used");
   selected.push(text);
   const s=document.createElement("span");
   s.className="tile";
   s.textContent=text;
   s.onclick=()=>{
     const pos=selected.indexOf(text);
     if(pos>-1) selected.splice(pos,1);
     b.classList.remove("used");
     s.remove();
   };
   $("answer").appendChild(s);
 };
 $("tiles").appendChild(b);
}

function selectedChoice(){
 return selected.length ? selected[0] : null;
}

function checkPattern(){
 result(selectedChoice()===lessons[current][1]);
}

function checkSentence(){
 const practice = makePracticeSentence(lessons[current][3], lessons[current][4]);
 const target=tokenizeSentence(practice.jp);
 const good=selected.length===target.length &&
            selected.every((word,i)=>word===target[i]);
 result(good);
}

function checkMeaningFinal(){
 result(selectedChoice()===lessons[current][4]);
}

function result(good){
 const f=$("feedback");
 f.style.display="block";
 if(good){
   playCorrect();
   speakFeedback("Benar! Bagus sekali.");
   f.className="feedback ok";
   f.textContent="🌟 素晴らしい！ Benar!";
   xp+=5;
   save();
   updateStats();
   setTimeout(()=>{
     step++;
     selected=[];
     if(step>3) complete();
     else renderLesson();
   },850);
 }else{
   playWrong();
   speakFeedback("Belum tepat. Coba lagi.");
   f.className="feedback no";
   f.textContent="Belum tepat. Perhatikan pola dan contoh di atas, lalu coba lagi.";
   selected=[];
   document.querySelectorAll("#tiles .tile").forEach(x=>{
     x.classList.remove("used");
     x.style.border="";
   });
   if($("answer")) $("answer").innerHTML="";
 }
}

function complete(){
 stopSpeech();
 if(!understood.includes(current)){
   understood.push(current);
   understood.sort((a,b)=>a-b);
   localStorage.setItem("kitsumiBunpouUnderstood",JSON.stringify(understood));
 }
 done++;
 xp+=10;
 save();
 let s=Number(localStorage.getItem("kitsumiStreak")||0);
 const today=new Date().toDateString(), last=localStorage.getItem("kitsumiLastBunpou");
 if(last!==today){
   s++;
   localStorage.setItem("kitsumiStreak",s);
   localStorage.setItem("kitsumiLastBunpou",today);
 }
 playComplete();
 setTimeout(()=>{
   speakFeedback("Selamat! Kamu sudah menyelesaikan tiga soal Bunpou. Luar biasa, lanjut ke pola berikutnya!", "id-ID");
 },420);
 $("lesson").style.display="none";
 $("finish").style.display="flex";
 $("finishText").textContent=`Kamu menyelesaikan ${lessons[current][0]} dan mendapatkan XP. Mau lanjut ke pelajaran lain?`;
 updateStats();
}

function backMenu(){ stopSpeech(); $("lesson").style.display="none"; $("finish").style.display="none"; $("menu").style.display="block"; renderMenu();$("finish").style.display="none";$("menu").style.display="block";renderMenu();window.scrollTo(0,0)}
function shuffle(a){a.sort(()=>Math.random()-.5)}
renderMenu();
</script>
