<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitsumi — Beranda</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Nunito",Arial,Helvetica,sans-serif}
:root{--navy:#12396b;--blue:#2f7ff0;--light:#eef6ff;--muted:#8192a8;--pink:#e95775;--green:#20c878;--purple:#8150ed;--yellow:#ffd43b;--bg:#f7fbff}
body{background:var(--bg);color:var(--navy);min-height:100vh}
.app{width:100%;max-width:620px;min-height:100vh;margin:auto;padding-bottom:84px}
header{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #edf2f7;position:sticky;top:0;z-index:20}
.logo{font-size:38px;line-height:1;font-weight:900;letter-spacing:-2.5px;color:var(--navy)}
.logo .pink{color:var(--pink)}
.bell{width:44px;height:44px;border:0;background:#f3f7fc;border-radius:15px;font-size:22px;cursor:pointer}
main{padding:17px 20px 20px}
.welcome{min-height:142px;border-radius:27px;background:linear-gradient(110deg,#f0f8ff,#e5f2ff);display:flex;align-items:center;justify-content:space-between;overflow:hidden;padding:18px 16px 18px 22px;margin-bottom:14px;box-shadow:0 7px 22px rgba(30,70,120,.05)}
.welcome-text{z-index:1}.welcome-text h1{font-size:30px;font-weight:900;margin-bottom:7px;letter-spacing:-.7px}.welcome-text p{font-size:16px;color:#6f849d;line-height:1.4}
.kitsu{width:220px;height:170px;display:flex;align-items:center;justify-content:center;transform:translateX(8px);overflow:visible}.kitsu img{width:210px;height:210px;object-fit:contain;display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.08))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.stat{height:82px;background:#fff;border-radius:22px;display:flex;align-items:center;padding:12px 15px;box-shadow:0 7px 20px rgba(30,70,120,.06)}.stat-link{text-decoration:none;color:var(--navy);cursor:pointer;transition:transform .15s,box-shadow .15s}.stat-link:active{transform:scale(.97)}.stat-link:hover{box-shadow:0 9px 24px rgba(30,70,120,.10)}
.stat-icon{font-size:34px;width:46px;text-align:center;margin-right:8px}.stat-label{font-size:13px;color:#8c9caf;margin-bottom:3px}.stat-value{font-size:22px;font-weight:900}
.start-btn{width:100%;height:62px;border:0;border-radius:21px;background:var(--blue);color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 10px 20px rgba(47,127,240,.22);margin-bottom:21px}.start-btn:active{transform:scale(.985)}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 11px}.section-title{font-size:22px;font-weight:900}.see-all{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}
.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.material{text-decoration:none;color:var(--navy);background:#fff;min-height:151px;border-radius:22px;padding:14px 7px 11px;text-align:center;box-shadow:0 7px 20px rgba(30,70,120,.06);transition:.15s}.material:active{transform:scale(.97)}
.material-icon{width:61px;height:61px;margin:0 auto 9px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:33px;font-weight:900}.green{background:#dcfaeb;color:#19a965}.blue{background:#e2efff;color:var(--blue)}.purple{background:#f0e6ff;color:var(--purple)}
.material h3{font-size:16px;font-weight:900;margin-bottom:4px}.material p{font-size:11px;color:#8b98a9;line-height:1.25}
.quote{min-height:101px;border-radius:23px;background:linear-gradient(110deg,#edf7ff,#e6f3ff);display:flex;align-items:center;padding:10px 13px;overflow:hidden}.quote-kitsu{width:82px;height:82px;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center}.quote-kitsu img{width:82px;height:82px;object-fit:contain;display:block;filter:drop-shadow(0 5px 4px rgba(0,0,0,.08))}.quote-text{font-size:15px;font-weight:700;line-height:1.35}.quote-author{color:#74879e;font-size:12px;font-weight:400;margin-top:4px}
.progress-card{background:#fff;border-radius:21px;padding:14px 16px;margin-top:14px;box-shadow:0 7px 20px rgba(30,70,120,.06)}.progress-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:9px}.progress-top span:last-child{color:var(--blue)}.progress-track{height:9px;border-radius:20px;background:#e9f0f7;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .3s}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);height:76px;background:rgba(255,255,255,.98);border-top:1px solid #edf0f5;display:grid;grid-template-columns:repeat(3,1fr);z-index:100;box-shadow:0 -7px 20px rgba(20,50,90,.06);backdrop-filter:blur(8px)}
.nav-item{text-decoration:none;color:#a1acba;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700}.nav-icon{font-size:24px;line-height:1}.nav-active{color:var(--blue)}
@media(max-width:380px){main{padding-left:15px;padding-right:15px}.welcome{padding-left:18px}.welcome-text h1{font-size:26px}.welcome-text p{font-size:14px}.kitsu{width:150px;height:150px;transform:translateX(4px)}.kitsu img{width:150px;height:150px}.material{min-height:146px}.material-icon{width:57px;height:57px}.material h3{font-size:15px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
<header>
  <div class="logo">Kits<span class="pink">u</span>mi</div>
  <button class="bell" aria-label="Notifikasi" onclick="showNotice()">🔔</button>
</header>

<main>
  <section class="welcome">
    <div class="welcome-text">
      <h1>こんにちは!</h1>
      <p>Selamat datang kembali!<br>Siap belajar hari ini?</p>
    </div>
    <div class="kitsu" aria-label="Kitsu"><img src="kitsu.gif" alt="Kitsu" /></div>
  </section>

  <section class="stats">
    <a class="stat stat-link" href="streak.html" aria-label="Buka Streak">
      <div class="stat-icon">🔥</div>
      <div><div class="stat-label">Streak</div><div class="stat-value"><span id="streak">0</span> hari</div></div>
    </a>
    <a class="stat stat-link" href="xp.html" aria-label="Buka XP">
      <div class="stat-icon">⭐</div>
      <div><div class="stat-label">XP</div><div class="stat-value" id="xp">0</div></div>
    </a>
  </section>

  <button class="start-btn" onclick="mulaiBelajar()">▶&nbsp; Mulai Belajar</button>

  <div class="section-head">
    <h2 class="section-title">Pilih Materi</h2>
    <button class="see-all" onclick="location.href='materi.html'">Lihat semua →</button>
  </div>

  <section class="materials">
    <a class="material" href="kosakata.html"><div class="material-icon green">📖</div><h3>Kotoba</h3><p>Kosakata<br>sehari-hari</p></a>
    <a class="material" href="kanji.html"><div class="material-icon blue">漢</div><h3>Kanji</h3><p>Huruf<br>Jepang</p></a>
    <a class="material" href="latihan.html"><div class="material-icon purple">✎</div><h3>Latihan</h3><p>Uji<br>pemahaman</p></a>
  </section>

  <section class="quote">
    <div class="quote-kitsu"><img src="kitsu-head-transparent-final.png" alt="Kitsu"></div>
    <div class="quote-text">"Bahasa baru,<br>dunia baru untukmu."<div class="quote-author">— Kitsu —</div></div>
  </section>

  <section class="progress-card">
    <div class="progress-top"><span>Perjalanan belajarmu</span><span id="progressText">0%</span></div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </section>
</main>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item nav-active"><span class="nav-icon">🏠</span><span>Beranda</span></a>
  <a href="materi.html" class="nav-item"><span class="nav-icon">📖</span><span>Materi</span></a>
  <a href="profil.html" class="nav-item"><span class="nav-icon">♙</span><span>Profil</span></a>
</nav>

<script>
function mulaiBelajar(){location.href='kosakata.html'}
function showNotice(){alert('🔔 Belum ada notifikasi baru. Terus belajar bersama Kitsu!')}

const xp=Number(localStorage.getItem('kitsumiXP')||0);
const streak=Number(localStorage.getItem('kitsumiStreak')||0);
document.getElementById('xp').textContent=xp;
document.getElementById('streak').textContent=streak;

// Progress sederhana berdasarkan 120 Kanji + 120 kosakata + 87 bunpou.
function getDone(prefix,total){
  let done=0;
  for(let i=1;i<=total;i++) if(localStorage.getItem(prefix+i)==='done') done++;
  return done;
}
const kanjiDone=getDone('kitsumiKanjiDay',12);
const kotobaDone=getDone('kitsumiKotobaDay',10);
const bunpouDone=getDone('kitsumiBunpouLesson',87);
const total=Math.min(100,Math.round(((kanjiDone/12)+(kotobaDone/10)+(bunpouDone/87))/3*100));
document.getElementById('progressBar').style.width=total+'%';
document.getElementById('progressText').textContent=total+'%';
</script>
</body>
</html>
