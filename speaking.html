.kitsu{position:relative;z-index:2;width:190px;height:190px;border-radius:55px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px;border:7px solid #35baf4;box-shadow:0 12px 0 rgba(25,125,180,.12);transform:rotate(-2deg)}
.face{font-size:92px}
.bar{position:absolute;bottom:0;width:220px;height:13px;border-radius:20px;background:#a9d8e9}
.content{padding:25px 24px 120px}

.play{width:52px;height:52px;border:0;border-radius:16px;background:#18aaf0;color:#fff;font-size:27px}
.wave{height:48px;flex:1;display:flex;align-items:center;gap:4px;overflow:hidden}
.wave i{width:5px;border-radius:10px;background:#18aaf0;opacity:.8}
.audio.playing .wave i{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scaleY:.3);opacity:.45}}
.counter{text-align:center;color:#5790a9;font-size:14px;margin:11px 0 20px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.choice{background:#fff;border:4px solid #ccebf5;border-radius:26px;padding:7px;color:#17324a;min-height:310px;cursor:pointer;box-shadow:0 8px 18px rgba(30,150,200,.10)}
.choice:active{transform:scale(.97)}
.pic{height:245px;border-radius:20px;background:linear-gradient(145deg,#effcff,#dff7ff);display:flex;align-items:center;justify-content:center;font-size:100px}
.label{font-size:19px;font-weight:900;padding:13px 5px 8px}
.choice.correct{border-color:#27c96f;background:#edfff4}
.choice.wrong{border-color:#ff7474;background:#fff0f0}
.feedback{min-height:58px;text-align:center;padding:16px 8px;font-size:17px;font-weight:900;color:#24718e}
.progressWrap{position:fixed;left:50%;bottom:67px;transform:translateX(-50%);width:min(850px,calc(100% - 48px));z-index:5}
.progress{height:10px;background:#cce8f0;border-radius:20px;overflow:hidden}
.progress>div{height:100%;background:#18aaf0;width:0;transition:.3s}
.xp{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:12px;color:#149edc;font-weight:900}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(900px,100%);height:70px;background:#f7fdff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:6}
.flag,.tool{height:52px;min-width:52px;border-radius:18px;cursor:pointer;font-size:25px}
.flag{border:0;background:#e2f5fb;color:#24718e}
.tools{display:flex;gap:12px}.tool{border:3px solid #12aaf1;background:#fff;color:#12aaf1;font-weight:900;box-shadow:0 5px 0 #c5ebf8}
.result{display:none;text-align:center;padding:45px 25px}.result .big{font-size:72px}
.result h2{font-size:32px;color:#18aaf0}.result p{font-size:18px;color:#bbb}

@media(max-width:600px){.top{height:350px}.choice{min-height:285px}.pic{height:220px;font-size:84px}.label{font-size:17px}}
@media(max-width:430px){.answers{gap:15px}.choice{min-height:265px}.pic{height:200px;font-size:72px}.label{font-size:15px}.content{padding-left:20px;padding-right:20px}}

</head>

window.speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(lessons[index].jp);
u.lang="ja-JP";u.rate=slow?.68:.88;
const voices=window.speechSynthesis.getVoices().filter(v=>/^ja(-|_)?JP/i.test(v.lang));
if(voices.length){
  const maleWords=["male","man","otoya","ichiro","hattori","takumi"];
  const femaleWords=["female","woman","kyoko","haruka"];
  const target=index%2===0?maleWords:femaleWords;
  let picked=voices.find(v=>target.some(w=>v.name.toLowerCase().includes(w)));
  if(!picked)picked=voices[index%voices.length];
  u.voice=picked;
}
u.pitch=index%2===0?0.92:1.08;
const a=document.getElementById("audioBox");
a.classList.add("playing");
u.onend=()=>a.classList.remove("playing");
window.speechSynthesis.speak(u)
}
function slowSpeak(){slow=!slow;document.getElementById("speedBtn").textContent=slow?"0.7×":"1×";speak()}
function render(){
answered=false;let l=lessons[index];
document.getElementById("counter").textContent=`Latihan ${index+1} / 100`;
document.getElementById("feedback").textContent="";
let a=[{text:l.correct,emoji:l.emojiCorrect,ok:true},{text:l.wrong,emoji:l.emojiWrong,ok:false}];
if(index%2)a.reverse();
document.getElementById("answers").innerHTML=a.map(x=>`<button class="choice" data-ok="${x.ok}" onclick="choose(this)"><div class="pic">${x.emoji}</div><div class="label">${x.text}</div></button>`).join("");
document.getElementById("progress").style.width=(index/100*100)+"%";
document.getElementById("xp").textContent=xp+" XP";wave();setTimeout(speak,350)
}
function choose(btn){
if(answered)return;answered=true;let ok=btn.dataset.ok==="true";
if(ok){btn.classList.add("correct");score++;xp+=10;document.getElementById("feedback").textContent="✓ Benar! +10 XP"}
else{btn.classList.add("wrong");document.querySelector('[data-ok="true"]').classList.add("correct");document.getElementById("feedback").textContent="Belum tepat. Dengarkan lagi."}
document.getElementById("xp").textContent=xp+" XP";
localStorage.setItem("kitsumiSpeakingXP",xp);localStorage.setItem("kitsumiSpeakingProgress",index+1)
}
function nextQuestion(){if(!answered){document.getElementById("feedback").textContent="Pilih jawaban dulu 😊";return}if(index<99){index++;render()}else finish()}
function hint(){if(answered)return;let c=document.querySelector('[data-ok="true"]');c.style.opacity=".45";setTimeout(()=>c.style.opacity="1",800);document.getElementById("feedback").textContent="💡 Petunjuk: lihat gambar yang paling sesuai."}
function reportQuestion(){document.getElementById("feedback").textContent="🚩 Latihan ditandai untuk diperiksa."}
function finish(){document.getElementById("lesson").style.display="none";document.getElementById("result").style.display="block";document.getElementById("progress").style.width="100%";document.getElementById("scoreText").textContent=`Skor: ${score} / 100 • ${xp} XP`;localStorage.setItem("kitsumiSpeakingCompleted","true")}
function restart(){index=0;score=0;xp=0;document.getElementById("lesson").style.display="block";document.getElementById("result").style.display="none";render()}
render();
</script>
</body>
</html>
