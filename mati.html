<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Kitsumi — Materi</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    :root {
      --navy: #12396b;
      --blue: #2f7ff0;
      --muted: #a0a9b5;
      --bg: #f8fbff;
    }

    button, input, textarea, select {
      font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    header {
      height: 92px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .logo {
      font-size: 48px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--navy);
    }

    .logo .pink {
      color: #e95775;
    }

    .bell {
      border: 0;
      background: transparent;
      font-size: 36px;
      line-height: 1;
    }

    main {
      padding: 24px 28px 40px;
    }

    .page-title {
      font-size: 34px;
      font-weight: 800;
      margin: 8px 0 24px;
    }

    .materials {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .material {
      min-height: 270px;
      background: white;
      border-radius: 27px;
      padding: 30px 14px 22px;
      text-align: center;
      text-decoration: none;
      color: var(--navy);
      box-shadow: 0 8px 22px rgba(30, 70, 120, .07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: transform .15s;
    }

    .material:active {
      transform: scale(.97);
    }

    .material-icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      margin-bottom: 22px;
      flex-shrink: 0;
    }

    .green {
      background: #ddfaed;
    }

    .blue {
      background: #e4f0ff;
    }

    .purple {
      background: #f0e7ff;
    }

    .material-icon.bunpou {
      background: #e4f0ff;
      color: transparent;
    }

    .material h2 {
      font-size: 27px;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .material p {
      color: #a0a9b5;
      font-size: 18px;
      line-height: 1.2;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(620px, 100%);
      height: 82px;
      background: rgba(255,255,255,.98);
      border-top: 1px solid #edf0f5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 100;
      box-shadow: 0 -7px 20px rgba(20, 50, 90, .06);
    }

    .nav-item {
      text-decoration: none;
      color: #a1acba;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 16px;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 34px;
      line-height: 1;
    }

    .nav-active {
      color: var(--blue);
    }

    @media (max-width: 500px) {
      header {
        height: 76px;
        padding: 0 20px;
      }

      .logo {
        font-size: 36px;
      }

      .bell {
        font-size: 28px;
      }

      main {
        padding: 18px 18px 34px;
      }

      .page-title {
        font-size: 28px;
      }

      .intro {
        margin-left: 47px;
        font-size: 14px;
      }

      .material {
        min-height: 86px;
        border-radius: 21px;
        padding: 11px 13px;
      }

      .material-icon {
        width: 58px;
        height: 58px;
        border-radius: 17px;
        font-size: 31px;
      }

      .material h2 {
        font-size: 19px;
      }

      .material p {
        font-size: 12.5px;
      }

      .arrow {
        font-size: 30px;
      }

      .bottom-nav {
        height: 72px;
      }

      .nav-icon {
        font-size: 27px;
      }

      .nav-item {
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {
      main {
        padding-left: 15px;
        padding-right: 15px;
      }

      .intro {
        margin-left: 45px;
      }

      .material {
        gap: 11px;
      }

      .material-icon {
        width: 54px;
        height: 54px;
        font-size: 29px;
      }

      .material h2 {
        font-size: 18px;
      }
    }

      .materials {
        gap: 10px;
      }

      .material {
        min-height: 225px;
      }

      .material-icon {
        width: 82px;
        height: 82px;
        font-size: 48px;
      }

      .material h2 {
        font-size: 20px;
      }

      .material p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="logo">Kits<span class="pink">u</span>mi</div>
      <button class="bell" aria-label="Notifikasi">🔔</button>
    </header>

    <main>
      <div class="page-head">
        <button class="back-btn" onclick="history.back()" aria-label="Kembali">‹</button>
        <h1 class="page-title">Materi</h1>
      </div>

      <p class="intro">Pilih materi yang ingin kamu pelajari hari ini.</p>

      <section class="materials">

        <a class="material green-card" href="kosakata.html">
          <div class="material-icon green">📖</div>
          <div class="material-copy">
            <h2>Kotoba</h2>
            <p>Belajar kosakata sehari-hari</p>
          </div>
          <span class="arrow">›</span>
        </a>

        <a class="material blue-card" href="kanji.html">
          <div class="material-icon blue">漢</div>
          <div class="material-copy">
            <h2>Kanji</h2>
            <p>Mengenal huruf Jepang</p>
          </div>
          <span class="arrow">›</span>
        </a>

        <a class="material purple-card" href="bunpou.html">
          <div class="material-icon purple">文</div>
          <div class="material-copy">
            <h2>Bunpou</h2>
            <p>Pola kalimat dasar</p>
          </div>
          <span class="arrow">›</span>
        </a>

        <a class="material orange-card" href="latihan.html">
          <div class="material-icon orange">🎧</div>
          <div class="material-copy">
            <h2>Latihan</h2>
            <p>Uji pemahamanmu</p>
          </div>
          <span class="arrow">›</span>
        </a>

        <button class="material pink-card coming-soon" type="button" onclick="comingSoon('Percakapan')">
          <div class="material-icon pink">💬</div>
          <div class="material-copy">
            <h2>Percakapan</h2>
            <p>Latihan dialog sehari-hari</p>
          </div>
          <span class="arrow">›</span>
        </button>

      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Beranda</span>
    </a>

    <a href="materi.html" class="nav-item nav-active">
      <span class="nav-icon">📖</span>
      <span>Materi</span>
    </a>

    <a href="profil.html" class="nav-item">
      <span class="nav-icon">♙</span>
      <span>Profil</span>
    </a>
  </nav>

  <script>
    function comingSoon(name) {
      alert(name + " segera hadir di Kitsumi 🦊");
    }
  </script>
</body>
</html>
